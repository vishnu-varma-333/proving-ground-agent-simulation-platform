[project]
name = "pg-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pg-sdk",
  "pyyaml>=6.0",
]

[tool.uv.sources]
pg-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_scheduler"]
