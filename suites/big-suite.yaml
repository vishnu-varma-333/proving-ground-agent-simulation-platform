suite:
  id: big-suite
  name: Big suite (order status lookups, for the fairness test)

agent_version:
  id: reference-agent-dev
  image: reference-agent
  git_sha: dev

priority: 1
seeds: [1]

scenarios:
  - id: lookup-1001-a
    persona: Customer checking order status
    goal: Check status of order ord_1001
    user_message: "What is the status of order ord_1001?"
    env_template: default
  - id: lookup-1002-a
    persona: Customer checking order status
    goal: Check status of order ord_1002
    user_message: "What is the status of order ord_1002?"
    env_template: default
  - id: lookup-1001-b
    persona: Customer checking order status
    goal: Check status of order ord_1001 again
    user_message: "Can you tell me the status of order ord_1001?"
    env_template: default
  - id: lookup-1002-b
    persona: Customer checking order status
    goal: Check status of order ord_1002 again
    user_message: "Can you tell me the status of order ord_1002?"
    env_template: default
  - id: lookup-1001-c
    persona: Customer checking order status
    goal: Check status of order ord_1001 once more
    user_message: "Status update on ord_1001 please?"
    env_template: default
  - id: lookup-1002-c
    persona: Customer checking order status
    goal: Check status of order ord_1002 once more
    user_message: "Status update on ord_1002 please?"
    env_template: default
