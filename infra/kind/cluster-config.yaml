kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: proving-ground
# Routes every docker.io pull through a local pull-through registry cache
# (see scripts/up.sh and DECISIONS.md). `kind load docker-image` was tried
# first and reliably fails against Docker Desktop's containerd-snapshotter
# image store ("ctr: content digest ... not found" - a known kind
# limitation, not a config error on our side); this mirror is kind's own
# documented workaround and also fixes the real problem (repeat bring-ups
# re-pulling every image from Docker Hub) more durably than image loading
# would have.
# A second, separate registry (localhost:5002) for OUR OWN built images
# (the worker container, Milestone 6) - kind-registry-mirror above is a
# read-through PROXY for docker.io specifically and isn't a place to push
# arbitrary new image names; a plain writable registry is kind's own
# documented pattern for this (kind.sigs.k8s.io/docs/user/local-registry).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["http://kind-registry-mirror:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5002"]
      endpoint = ["http://kind-registry-local:5000"]
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30432
        hostPort: 25432
        protocol: TCP
      - containerPort: 30123
        hostPort: 28123
        protocol: TCP
      - containerPort: 30900
        hostPort: 29000
        protocol: TCP
      - containerPort: 30422
        hostPort: 24222
        protocol: TCP
      - containerPort: 30822
        hostPort: 28222
        protocol: TCP
      - containerPort: 30901
        hostPort: 29001
        protocol: TCP
      - containerPort: 30902
        hostPort: 29002
        protocol: TCP
      - containerPort: 30903
        hostPort: 29090
        protocol: TCP
      - containerPort: 30904
        hostPort: 23000
        protocol: TCP
  - role: worker
  - role: worker
