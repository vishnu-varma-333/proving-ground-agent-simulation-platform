# S3-compatible object storage for tapes and environment snapshots.
#
# The spec called for MinIO here. MinIO Inc. withdrew the minio/minio and
# minio/mc images from Docker Hub and quay.io in 2025 (the AGPL community
# edition is now source-only as of its final 2025-10-15 release) - every tag
# now returns "pull access denied" for anonymous pulls. See DECISIONS.md for
# the substitution rationale: SeaweedFS, run as a single-process server with
# its embedded S3 gateway enabled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-storage-data
  namespace: proving-ground
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-storage
  namespace: proving-ground
spec:
  serviceName: object-storage
  replicas: 1
  selector:
    matchLabels:
      app: object-storage
  template:
    metadata:
      labels:
        app: object-storage
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -master.volumeSizeLimitMB=1000
          ports:
            - containerPort: 9333
              name: master
            - containerPort: 8080
              name: volume
            - containerPort: 8888
              name: filer
            - containerPort: 8333
              name: s3
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            # 512Mi was enough for this project's normal traffic (one
            # agent's own tape reads/writes) but OOMKilled repeatedly,
            # found live, under Milestone 10's scale test - several
            # concurrent replay-bench workers all reading tapes at once
            # is real concurrent S3 load this service hadn't seen before,
            # and SeaweedFS's own master/volume/filer/S3-gateway
            # processes (all one container here) need real headroom for
            # it, not just this project's own steady-state usage.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: object-storage-data
---
apiVersion: v1
kind: Service
metadata:
  name: object-storage
  namespace: proving-ground
spec:
  type: NodePort
  selector:
    app: object-storage
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30901
    - name: filer
      port: 8888
      targetPort: 8888
      nodePort: 30902
---
apiVersion: batch/v1
kind: Job
metadata:
  name: object-storage-create-buckets
  namespace: proving-ground
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.17.62
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "proving_ground"
            - name: AWS_SECRET_ACCESS_KEY
              value: "proving-ground-local-dev"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              aws --endpoint-url http://object-storage:8333 s3 mb s3://proving-ground-tapes || true
              aws --endpoint-url http://object-storage:8333 s3 mb s3://proving-ground-snapshots || true
              aws --endpoint-url http://object-storage:8333 s3 ls
              echo "buckets ready"
